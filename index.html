function teamsPage(){const ss=standings(),s=ss.find(s=>s.t===selectedTeam)||ss[0];if(!s)return '';const team=s.t;let matches=data[cat].filter(x=>relevant(x,team)).slice().sort(scheduleSort);const performed=matches.filter(played).sort((a,b)=>meetDate(b).localeCompare(meetDate(a)));const scheduled=matches.filter(x=>!played(x));function side(loc){let g=performed.filter(x=>(loc==='home'?x.home===team:x.away===team));let pf=0,ps=0,w=0,l=0;for(const x of g){let [a,b]=scoreFor(x,team);pf+=a;ps+=b;if(a>b)w++;else if(a<b)l++}return {g:g.length,w,l,pf:g.length?pf/g.length:null,ps:g.length?ps/g.length:null}}const home=side('home'),away=side('away');return `<h1 class="section-title">Scheda squadra · ${cat}</h1><div class="card"><div class="eyebrow">Scegli una squadra</div><select class="field" style="margin-top:8px" onchange="setTeam(this.value)">${teamNames().map(t=>`<option value="${esc(t)}" ${team===t?'selected':''}>${esc(t)}</option>`).join('')}</select><h2 style="margin:18px 0 8px;color:var(--navy)">${esc(team)}</h2><div class="detail-grid"><div class="mini"><strong>${s.pos}°</strong><span>Posizione</span></div><div class="mini"><strong>${s.pts}</strong><span>Punti classifica*</span></div><div class="mini"><strong>${s.gp}</strong><span>Partite giocate</span></div><div class="mini"><strong>${s.w}–${s.l}</strong><span>Vittorie / sconfitte</span></div><div class="mini"><strong>${number(s.avgF)}</strong><span>Media punti fatti</span></div><div class="mini"><strong>${number(s.avgA)}</strong><span>Media punti subiti</span></div></div><div class="spacer"></div><div class="row"><div class="subtle">Totale PF <b>${s.pf}</b> · PS <b>${s.pa}</b></div><div class="tag">Differenza ${s.diff>0?'+':''}${s.diff}</div></div><hr class="divider"><h3 class="small-title">Rendimento casa / trasferta</h3><div class="venue-stat"><div class="venue-name">🏠 Casa <span class="subtle">(${home.g} gare)</span></div><div class="venue-record">${home.w} V / ${home.l} P</div><div class="venue-averages">${numbe function parseTSV(content){let lines=content.replace(/^\uFEFF/,'').replace(/\r/g,'').split('\n').filter(x=>x.trim());const head=lines.shift().split('\t');if(head.length!==3||head[0]!=='STELLA_FIP')throw new Error('Intestazione TSV non riconosciuta');const category=head[1],expected=category==='U15'?90:category==='U19'?110:null;if(!expected||Number(head[2])!==expected||lines.length!==expected)throw new Error('Categoria o numero gare non corretto');let map=new Map();for(let line of lines){const f=line.split('\t');if(f.length!==7||!/^[0-9]{6}$/.test(f[0])||map.has(f[0]))throw new Error('Numero gara duplicato o riga non valida');map.set(f[0],f)}let copy=structuredCloneSafe(data[category]);if(copy.some(x=>!map.has(x.id)))throw new Error('Il TSV non corrisponde ai numeri gara del calendario');for(let x of copy){let f=map.get(x.id),type=f[3];if(type==='RISULTATO') {if(!/^\d{1,3}$/.test(f[4])||!/^\d{1,3}$/.test(f[5]))throw new Error('Punteggio non valido: '+x.id);x.homeScore=Number(f[4]);x.awayScore=Number(f[5])}else if(type==='PROGRAMMATA'){if(played(x))throw new Error('La gara '+x.id+' ha già un risultato nei dati salvati: importazione bloccata');if(!/^\d{2}\/\d{2}\/\d{2}$/.test(f[4])||!/^\d{2}:\d{2}$/.test(f[5]))throw new Error('Data/ora non valide: '+x.id);const [d,m,y]=f[4].split('/');x.date='20'+y+'-'+m+'-'+d;x.time=f[5];x.venue=f[6]||x.venue}else throw new Error('Stato non valido: '+x.id)}return {category,copy}}

// Legge i CSV pubblicati sul web (sola lettura). Nessuna modifica ai Fogli Google.
// Parsing RFC 4180: supporta virgole nei nomi delle palestre e celle tra virgolette.
function parseCSV(csv){
 const result=[];let row=[],value='',quoted=false;
 csv=csv.replace(/^\uFEFF/,'');
 for(let i=0;i<csv.length;i++){
  const c=csv[i];
  if(quoted){if(c==='"'&&csv[i+1]==='"'){value+='"';i++}else if(c==='"'){quoted=false}else{value+=c}}
  else if(c==='"'){quoted=true}
  else if(c===','){row.push(value);value=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&csv[i+1]==='\n')i++;row.push(value);if(row.some(v=>v!==''))result.push(row);row=[];value=''}
  else{value+=c}
 }
 if(quoted)throw Error('CSV incompleto: virgolette non chiuse');
 if(value!==''||row.length){row.push(value);if(row.some(v=>v!==''))result.push(row)}
 return result;
}
function scoreOrNull(v){
 v=String(v||'').trim();
 if(!v)return null;
 if(!/^\d{1,3}$/.test(v))throw Error('Punteggio non numerico');
 return Number(v);
}
function normalizeISO(v){
 v=String(v||'').trim();if(!v)return '';
 if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;
 const d=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
 if(d)return d[3]+'-'+d[2].padStart(2,'0')+'-'+d[1].padStart(2,'0');
 throw Error('Data non riconosciuta: '+v);
}
function validatedCSV(category,csv){
 const grid=parseCSV(csv),expected=category==='U15'?90:110;
 if(grid.length!==expected+1)throw Error(category+': attese '+expected+' gare, trovate '+(grid.length-1));
 const header=grid.shift().map(x=>x.trim().toLowerCase());
 const required=['id','phase','round','rounddate','home','away','date','time','homescore','awayscore','venue'];
 const idx=required.map(k=>header.indexOf(k));
 if(idx.some(x=>x<0))throw Error(category+': colonne CSV non riconosciute');
 const refs=new Map(initialData[category].map(x=>[x.id,x])),found=new Set();
 const list=grid.map((r,i)=>{
  const f=Object.fromEntries(required.map((name,j)=>[name,(r[idx[j]]||'').trim()]));
  const id=f.id.padStart(6,'0');
  if(!/^\d{6}$/.test(id)||found.has(id)||!refs.has(id))throw Error(category+': numero gara non valido, riga '+(i+2));
  found.add(id);
  const base=refs.get(id);
  if(!f.home||!f.away||f.home===f.away)throw Error(category+': nomi squadre non validi, gara '+id);
  const homeScore=scoreOrNull(f.homescore),awayScore=scoreOrNull(f.awayscore);
  if((homeScore===null)!==(awayScore===null))throw Error(category+': punteggio incompleto, gara '+id);
  const phase=f.phase;
  if(!['Andata','Ritorno'].includes(phase)||!/^[0-9]+$/.test(f.round))throw Error(category+': giornata non valida, gara '+id);
  return {...base,id,phase,round:Number(f.round),roundDate:normalizeISO(f.rounddate),home:f.home,away:f.away,
   date:normalizeISO(f.date),time:f.time,homeScore,awayScore,venue:f.venue};
 });
 return list;
}
async function refreshCloud(){
 if(cloudBusy)return;
 cloudBusy=true;cloudReady=false;cloudStatus='Collegamento ai calendari Google in corso…';render();
 try{
  const response=await Promise.all(Object.entries(SHEETS).map(async ([category,url])=>{
   const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),16000);
   try{
    const res=await fetch(url+'?t='+Date.now(),{cache:'no-store',signal:controller.signal});
    if(!res.ok)throw Error(category+': HTTP '+res.status);
    return [category,validatedCSV(category,await res.text())];
   }finally{clearTimeout(timer)}
  }));
  // I calendari sono sostituiti solo dopo aver validato ENTRAMBE le categorie.
  const updated=Object.fromEntries(response);
  data={...data,...updated};
  try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}
  cloudReady=true;cloudLastSync=new Date().toLocaleString('it-IT');
  cloudStatus='✓ Calendari U15 e U19 disponibili (copia pubblicata da Google Sheets su GitHub Pages, sola lettura).';
 }catch(e){
  cloudStatus='⚠ Collegamento online non riuscito ('+String(e.message||e)+'). Nessuna modifica ai dati locali. Verifica la pubblicazione su GitHub Pages e la presenza dei due file dati/u15.csv e dati/u19.csv.';
 }finally{cloudBusy=false;render()}
}
